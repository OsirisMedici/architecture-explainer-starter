name: Check starter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun ci
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-presentation
          path: dist/index.html
